name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Strip binary (reduce size)
      run: |
        $binaryPath = "target\x86_64-pc-windows-msvc\release\ginjector.exe"
        if (Test-Path $binaryPath) {
          Write-Host "Stripping binary..."
          # Windows doesn't have strip, but we can skip this or use upx if needed
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ginjector-windows-x86_64
        path: target/x86_64-pc-windows-msvc/release/ginjector.exe
        retention-days: 30

  build-windows-gnu:
    name: Build Windows GNU (x86_64)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-gnu

    - name: Install MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-toolchain

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-mingw-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --target x86_64-pc-windows-gnu

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ginjector-windows-gnu-x86_64
        path: target/x86_64-pc-windows-gnu/release/ginjector.exe
        retention-days: 30

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
          libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release

    - name: Strip binary (reduce size)
      run: strip target/release/ginjector

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ginjector-linux-x86_64
        path: target/release/ginjector
        retention-days: 30

  build-macos:
    name: Build macOS (x86_64 + ARM64)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build universal binary
      run: |
        # Build for ARM64 (Apple Silicon)
        cargo build --release --target aarch64-apple-darwin
        mv target/release/ginjector target/release/ginjector-arm64

        # Build for x86_64 (Intel)
        cargo build --release --target x86_64-apple-darwin
        mv target/release/ginjector target/release/ginjector-x86_64

        # Create universal binary
        lipo -create -output target/release/ginjector-universal \
          target/release/ginjector-arm64 \
          target/release/ginjector-x86_64

    - name: Upload artifact (ARM64)
      uses: actions/upload-artifact@v4
      with:
        name: ginjector-macos-arm64
        path: target/release/ginjector-arm64
        retention-days: 30

    - name: Upload artifact (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: ginjector-macos-x86_64
        path: target/release/ginjector-x86_64
        retention-days: 30

    - name: Upload artifact (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: ginjector-macos-universal
        path: target/release/ginjector-universal
        retention-days: 30
