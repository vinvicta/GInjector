name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: GInjector ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## GInjector ${{ steps.version.outputs.VERSION }}

          ### Downloads

          Binaries are attached below for each platform.

          **Windows:** `ginjector-windows-x86_64.exe`
          **Linux:** `ginjector-linux-x86_64`
          **macOS:** Choose your architecture:
          - `ginjector-macos-arm64` (Apple Silicon M1/M2/M3)
          - `ginjector-macos-x86_64` (Intel)
          - `ginjector-macos-universal` (Both)

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-windows:
    name: Build Windows Release
    needs: create-release
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc

    - name: Build release binary
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: target/x86_64-pc-windows-msvc/release/ginjector.exe

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-linux:
    name: Build Linux Release
    needs: create-release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
          libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev

    - name: Build release binary
      run: cargo build --release

    - name: Strip binary
      run: strip target/release/ginjector

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/ginjector

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-macos:
    name: Build macOS Release
    needs: create-release
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build for ARM64
      run: cargo build --release --target aarch64-apple-darwin

    - name: Rename ARM64 binary
      run: mv target/release/ginjector target/release/ginjector-arm64

    - name: Build for x86_64
      run: cargo build --release --target x86_64-apple-darwin

    - name: Rename x86_64 binary
      run: mv target/release/ginjector target/release/ginjector-x86_64

    - name: Create universal binary
      run: |
        lipo -create -output target/release/ginjector-universal \
          target/release/ginjector-arm64 \
          target/release/ginjector-x86_64

    - name: Upload ARM64 to release
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/ginjector-arm64

    - name: Upload x86_64 to release
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/ginjector-x86_64

    - name: Upload universal to release
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/ginjector-universal

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
