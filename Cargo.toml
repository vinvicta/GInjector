[workspace]
resolver = "2"
members = [
    "gs2-compiler",
    "frida-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["vinvicta"]
license = "MIT"
repository = "https://github.com/vinvicta/GInjector"
description = "GS2 bytecode compiler and injector for Graal Online clients"

[workspace.dependencies]
# GUI
eframe = "0.29"
egui = "0.29"

# Async
tokio = { version = "1.38", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Parsing
logos = "0.13"
lalrpop = { version = "0.20", features = ["lexer"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
arc-swap = "1.7"

[package]
name = "ginjector"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = "0.29"
egui = "0.29"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
gs2-compiler = { path = "gs2-compiler" }
frida-bridge = { path = "frida-bridge" }
rfd = "0.14"
base64 = "0.22"
regex = "1.11"
tempfile = "3.14"

[[bin]]
name = "ginjector"
path = "src/main.rs"
